name: Build Android APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify runner Android SDK and required packages
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -x "$sdk/build-tools/35.0.0/apksigner" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$manager" ]; then
              manager=$(command -v sdkmanager || true)
            fi
            test -x "$manager"
            "$manager" --sdk_root="$sdk" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$sdk/platforms/android-35/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle :app:assembleDebug :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SANAI-CLEANER-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SANAI-CLEANER-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SANAI-CLEANER-v0.1.0-alpha.apk
          tag="v0.1.0-alpha.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" SANAI-CLEANER-v0.1.0-alpha.apk --target "$GITHUB_SHA" --prerelease --title "SANAI CLEANER v0.1.0 alpha" --notes "Debug-signed test APK. Build and lint passed. Device testing and stable signing pending. Do not use on important files before testing."
