plugins { id 'com.android.application' }
android {
 namespace 'com.sanai.cleaner'
 compileSdk 35
 defaultConfig { applicationId 'com.sanai.cleaner'; minSdk 30; targetSdk 35; versionCode 2; versionName '0.2.0' }
 signingConfigs {
  release {
   if (System.getenv('CLEANER_KEYSTORE')) {
    storeFile file(System.getenv('CLEANER_KEYSTORE'))
    storeType 'PKCS12'
    storePassword System.getenv('CLEANER_STORE_PASSWORD')
    keyAlias System.getenv('CLEANER_KEY_ALIAS')
    keyPassword System.getenv('CLEANER_KEY_PASSWORD') ?: System.getenv('CLEANER_STORE_PASSWORD')
   }
  }
 }
 buildTypes { release { if (System.getenv('CLEANER_KEYSTORE')) signingConfig signingConfigs.release } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
 implementation 'com.google.mlkit:image-labeling:17.0.9'
}